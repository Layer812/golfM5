; BALL'S EYE GOLF R13 — standalone, no remote source staging.
; Known-compatible M5Unified/M5GFX pair retained; this is a BOOT refactor only.
[platformio]
default_envs = golf_native
src_dir = src

[env:golf_native]
platform = espressif32 @ 6.12.0
board = golf-stopwatch
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    m5stack/M5Unified @ 0.2.21
    m5stack/M5GFX @ 0.2.28
